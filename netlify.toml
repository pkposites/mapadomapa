[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# API: /api/* vai para a função "api". Esta regra vem ANTES do fallback do SPA
# (a primeira regra que casa vence), garantindo JSON e nunca a página HTML.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA: as rotas do app ficam em public/_redirects (valem só no Netlify, não no servidor local).
# NÃO crie aqui uma regra "/*": sem ela, endereços inexistentes recebem o 404 de verdade (public/404.html).

# O service worker nunca deve ficar em cache, senão o PWA não atualiza.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/push-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ===== HOMOLOGAÇÃO (esta branch é a branch de produção do site de HOMOLOGAÇÃO) =====
# O site OFICIAL (id abaixo) nunca deve construir esta branch: se ela aparecer lá como
# branch deploy ou preview, o build é pulado (exit 0 = pular). No site de homologação
# esta branch é produção, então estas regras não se aplicam.
[context.branch-deploy]
  ignore = "test \"$SITE_ID\" = \"9dd54e92-2593-4fd0-a4dc-70405aa94b0c\""

[context.deploy-preview]
  ignore = "test \"$SITE_ID\" = \"9dd54e92-2593-4fd0-a4dc-70405aa94b0c\""

# Homologação nunca deve ser indexada.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
