<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#141715" />
<title>Página não encontrada — Mapa do Mapa</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#141715;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  main{width:100%;max-width:440px;text-align:center}
  img{width:88px;height:88px;border-radius:20px;background:#fff}
  p.code{margin:24px 0 0;color:#b9f46d;font-weight:700;letter-spacing:.1em;font-size:13px;text-transform:uppercase}
  h1{margin:8px 0 0;font-size:32px;line-height:1.1;letter-spacing:-.03em}
  p.t{margin:12px 0 0;color:#aab3ac;font-size:17px;line-height:1.5}
  .btns{margin-top:28px;display:grid;gap:12px}
  a{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:16px;font-weight:600;font-size:16px;text-decoration:none}
  a.primary{background:#b9f46d;color:#141715}
  a.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Mapa do Mapa" width="88" height="88" />
  <p class="code">Erro 404</p>
  <h1>Página não encontrada</h1>
  <p class="t">O endereço que você abriu não existe ou mudou de lugar.</p>
  <div class="btns">
    <a class="primary" href="/">Voltar ao início</a>
    <a class="ghost" href="/cadastro">Quero me cadastrar</a>
  </div>
</main>
</body>
</html>
